# Compliance data for the per-release NOTICE / SOURCES files (see scripts that
# consume this at publish time). Editing it never affects any build — it is pure
# publish-time metadata.
#
# `notices` maps a license id OR an exact package name to the attribution text a
# permissive license requires in a redistribution. Package-name keys win over
# license keys. `copyleft` lists the licenses whose binaries oblige us to offer
# corresponding source (the SOURCES file links each such package to its archive in
# the S3 store). `source_offer` is the written-offer preamble for that file.

notices:
  # --- by license id (permissive, attribution required) ---
  CFITSIO: "This product includes CFITSIO software developed by NASA/HEASARC."
  Geant4-SL-1.0: "This product includes software developed by Members of the Geant4 Collaboration (http://cern.ch/geant4)."
  IJG: "This software is based in part on the work of the Independent JPEG Group."
  bzip2-1.0.6: "This product includes the bzip2 library, Copyright (C) 1996-2010 Julian R Seward."
  MIT: "Includes MIT-licensed components; their copyright and permission notices are retained in the installed trees."
  BSD-3-Clause: "Includes BSD-3-Clause components; their copyright notices are retained in the installed trees."
  Apache-2.0: "Includes Apache-2.0 components; see the accompanying LICENSE/NOTICE files in the installed trees."
  MPL-2.0: "Includes Mozilla Public License 2.0 components; source is available (see SOURCES)."
  # --- by exact package name (overrides the license entry) ---
  madx: "MAD-X — Copyright CERN. Distributed under the MIT License."
  photoscpp: "PHOTOS++ — Copyright (c) the PHOTOS++ authors. Distributed under the MIT License."

# Licenses that trigger the source-provision obligation (copyleft / weak-copyleft).
copyleft:
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - MPL-2.0
  - GPL-3.0-or-later WITH GCC-exception-3.1

source_offer: |
  This distribution includes binaries built from copyleft-licensed source
  (GPL / LGPL / MPL and compatible). The corresponding source code — the exact
  version each binary was built from — is available in the bits source store at
  the URLs listed below, and this written offer is valid for at least three (3)
  years from the date of this release. For sources fetched from a version-control
  system, the upstream repository and commit are given instead.
